name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.3'
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test
